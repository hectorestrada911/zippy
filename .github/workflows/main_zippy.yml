# Azure Deployment Center workflow — monorepo: API lives in backend/
# App name must match your Web App in Azure (e.g. zippyy).

name: Build and deploy Python app to Azure Web App - zippy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Validate install from backend/ (matches repo layout)
      - name: Create venv and install dependencies (backend/)
        working-directory: backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Package only backend/ as site root (no frontend, no antenv)
      - name: Stage deployment package
        run: |
          mkdir -p deploy_pkg
          rsync -a --exclude antenv --exclude __pycache__ --exclude .pytest_cache --exclude tests backend/ deploy_pkg/

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy_pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C7350B46AFC4FE5AB57512AF567E1A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7A9E02C223E94348B855E3B9BEC583FB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D81DECF0EB434D989134BE32A3700E3D }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "zippyy"
          slot-name: Production
          package: ./deploy
