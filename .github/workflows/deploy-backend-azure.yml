# Deploy FastAPI backend from backend/ to Azure App Service (Linux Python).
# Frontend stays separate (e.g. Vercel or another Azure Web App).
#
# Prerequisites (Azure Portal → Web App → Configuration):
#   Startup Command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
#   App settings: SECRET_KEY, DATABASE_URL, FRONTEND_URL, QUICKBOOKS_*, etc.
#
# OIDC secrets (GitHub repo → Settings → Secrets):
#   AZURE_CLIENT_ID      = User-assigned managed identity → Application (client) ID
#   AZURE_TENANT_ID      = Entra tenant ID
#   AZURE_SUBSCRIPTION_ID = Your subscription ID
# (If you used Deployment Center “Save”, Azure may have added differently named
#  secrets — copy the same three GUIDs into the names above, or edit this file.)
name: Deploy backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: zippyy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC / user-assigned MI)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend folder as site root
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: ./backend
