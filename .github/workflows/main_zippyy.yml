# Azure Deployment Center — Web App zippyy (monorepo: code in backend/)

name: Build and deploy Python app to Azure Web App - zippyy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies (backend/)
        working-directory: backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Stage deployment package
        run: |
          mkdir -p deploy_pkg
          rsync -a --exclude antenv --exclude __pycache__ --exclude .pytest_cache --exclude tests backend/ deploy_pkg/

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy_pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3529DA7EE634450DBA900F974AC21E54 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A109AD78C08D4F81928189B8738DF80D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_832B16F7190D44E7A8FA1BB5C335E079 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "zippyy"
          slot-name: Production
          package: ./deploy
